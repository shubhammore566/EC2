version: 1.0
runtime: python313
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.13.0
  command: streamlit run app.py --server.port=8080 --server.address=0.0.0.0 --server.headless=true
  network:
    port: 8080
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
